<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030014"/>
      <stop offset="50%" style="stop-color:#0c0f1a"/>
      <stop offset="100%" style="stop-color:#030014"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7042f8"/>
      <stop offset="100%" style="stop-color:#b49bff"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7042f8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#b49bff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b49bff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7042f8;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7042f8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7042f8;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7042f8" flood-opacity="0.5"/>
    </filter>
    <filter id="iconGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#7042f8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(64,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(128,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(192,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(256,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(320,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(384,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(448,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(512,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(576,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(640,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(704,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(768,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(832,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(896,0)"/>
    <line x1="0" y1="0" x2="0" y2="1024" stroke="#b49bff" stroke-width="1" transform="translate(960,0)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,64)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,128)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,192)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,256)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,320)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,384)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,448)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,512)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,576)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,640)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,704)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,768)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,832)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,896)"/>
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#b49bff" stroke-width="1" transform="translate(0,960)"/>
  </g>

  <!-- Glow effects -->
  <ellipse cx="300" cy="350" rx="300" ry="300" fill="url(#glow1)" filter="url(#blur1)"/>
  <ellipse cx="750" cy="700" rx="250" ry="250" fill="url(#glow2)" filter="url(#blur1)"/>
  <ellipse cx="512" cy="512" rx="200" ry="200" fill="#7042f8" opacity="0.06" filter="url(#blur2)"/>

  <!-- Code editor mockup (background decoration) -->
  <g transform="translate(80, 120)" opacity="0.12">
    <rect x="0" y="0" width="400" height="280" rx="12" fill="#0f1220" stroke="#2A0E61" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <text x="20" y="55" fill="#7042f8" font-family="monospace" font-size="13">const</text>
    <text x="65" y="55" fill="#b49bff" font-family="monospace" font-size="13">buildFaster</text>
    <text x="170" y="55" fill="#666" font-family="monospace" font-size="13">= () =&gt; {'{'}</text>
    <text x="35" y="80" fill="#7042f8" font-family="monospace" font-size="13">return</text>
    <text x="95" y="80" fill="#b49bff" font-family="monospace" font-size="13">claude</text>
    <text x="145" y="80" fill="#666" font-family="monospace" font-size="13">.assist({'{'})</text>
    <text x="20" y="105" fill="#666" font-family="monospace" font-size="13">{'}'}</text>
  </g>

  <!-- Second code block (right side) -->
  <g transform="translate(560, 620)" opacity="0.10">
    <rect x="0" y="0" width="380" height="260" rx="12" fill="#0f1220" stroke="#2A0E61" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <text x="20" y="55" fill="#7042f8" font-family="monospace" font-size="13">async</text>
    <text x="70" y="55" fill="#b49bff" font-family="monospace" font-size="13">function</text>
    <text x="145" y="55" fill="#fff" font-family="monospace" font-size="13">ship()</text>
    <text x="35" y="80" fill="#7042f8" font-family="monospace" font-size="13">await</text>
    <text x="85" y="80" fill="#b49bff" font-family="monospace" font-size="13">review(code)</text>
    <text x="35" y="105" fill="#7042f8" font-family="monospace" font-size="13">await</text>
    <text x="85" y="105" fill="#b49bff" font-family="monospace" font-size="13">deploy()</text>
  </g>

  <!-- Central AI Brain / Circuit icon -->
  <g transform="translate(512, 380)" filter="url(#iconGlow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#purple)" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#purple)" stroke-width="1.5" opacity="0.3"/>

    <!-- Brain/chip shape -->
    <rect x="-45" y="-45" width="90" height="90" rx="18" fill="url(#purple)" opacity="0.15" stroke="url(#purple)" stroke-width="2"/>

    <!-- Inner circuit lines -->
    <line x1="-25" y1="-15" x2="25" y2="-15" stroke="#b49bff" stroke-width="2" opacity="0.6"/>
    <line x1="-25" y1="0" x2="15" y2="0" stroke="#b49bff" stroke-width="2" opacity="0.6"/>
    <line x1="-15" y1="15" x2="25" y2="15" stroke="#b49bff" stroke-width="2" opacity="0.6"/>

    <!-- Circuit nodes -->
    <circle cx="-25" cy="-15" r="3" fill="#b49bff"/>
    <circle cx="25" cy="-15" r="3" fill="#7042f8"/>
    <circle cx="-25" cy="0" r="3" fill="#b49bff"/>
    <circle cx="15" cy="0" r="3" fill="#7042f8"/>
    <circle cx="-15" cy="15" r="3" fill="#b49bff"/>
    <circle cx="25" cy="15" r="3" fill="#7042f8"/>

    <!-- Connector lines going outward -->
    <line x1="45" y1="-15" x2="75" y2="-30" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>
    <line x1="45" y1="15" x2="75" y2="30" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>
    <line x1="-45" y1="-15" x2="-75" y2="-30" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>
    <line x1="-45" y1="15" x2="-75" y2="30" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-45" x2="0" y2="-75" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="45" x2="0" y2="75" stroke="#7042f8" stroke-width="1.5" opacity="0.4"/>

    <!-- Outer nodes -->
    <circle cx="75" cy="-30" r="4" fill="#7042f8" opacity="0.6"/>
    <circle cx="75" cy="30" r="4" fill="#7042f8" opacity="0.6"/>
    <circle cx="-75" cy="-30" r="4" fill="#7042f8" opacity="0.6"/>
    <circle cx="-75" cy="30" r="4" fill="#7042f8" opacity="0.6"/>
    <circle cx="0" cy="-75" r="4" fill="#7042f8" opacity="0.6"/>
    <circle cx="0" cy="75" r="4" fill="#7042f8" opacity="0.6"/>

    <!-- Speed lines -->
    <line x1="100" y1="-60" x2="140" y2="-60" stroke="#b49bff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="110" y1="-45" x2="135" y2="-45" stroke="#b49bff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
    <line x1="-100" y1="60" x2="-140" y2="60" stroke="#b49bff" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="-110" y1="45" x2="-135" y2="45" stroke="#b49bff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Floating particles -->
  <circle cx="150" cy="500" r="2" fill="#7042f8" opacity="0.5"/>
  <circle cx="870" cy="300" r="2.5" fill="#b49bff" opacity="0.4"/>
  <circle cx="200" cy="800" r="1.5" fill="#b49bff" opacity="0.6"/>
  <circle cx="800" cy="180" r="2" fill="#7042f8" opacity="0.5"/>
  <circle cx="650" cy="450" r="1.5" fill="#b49bff" opacity="0.3"/>
  <circle cx="380" cy="250" r="2" fill="#7042f8" opacity="0.4"/>
  <circle cx="900" cy="550" r="1.5" fill="#b49bff" opacity="0.5"/>
  <circle cx="120" cy="680" r="2" fill="#7042f8" opacity="0.3"/>

  <!-- Title text -->
  <text x="512" y="590" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" filter="url(#textShadow)">
    Claude × Developer
  </text>
  <text x="512" y="655" text-anchor="middle" fill="url(#purple)" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Warp Speed
  </text>

  <!-- Subtitle -->
  <text x="512" y="710" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    The good, the bad, and how to stay sharp
  </text>

  <!-- Bottom decorative line -->
  <line x1="362" y1="740" x2="662" y2="740" stroke="url(#purple)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Tags -->
  <g transform="translate(512, 790)">
    <rect x="-185" y="-15" width="80" height="30" rx="15" fill="#7042f8" opacity="0.15" stroke="#7042f8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="-145" y="6" text-anchor="middle" fill="#b49bff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">AI</text>

    <rect x="-90" y="-15" width="90" height="30" rx="15" fill="#7042f8" opacity="0.15" stroke="#7042f8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="-45" y="6" text-anchor="middle" fill="#b49bff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Claude</text>

    <rect x="15" y="-15" width="120" height="30" rx="15" fill="#7042f8" opacity="0.15" stroke="#7042f8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="75" y="6" text-anchor="middle" fill="#b49bff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Productivity</text>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1022" height="1022" rx="0" fill="none" stroke="#2A0E61" stroke-width="1" opacity="0.3"/>
</svg>